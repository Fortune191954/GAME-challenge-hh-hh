<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素冒险RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menuScreen" class="screen">
        <div class="menu-content">
            <h1 class="game-title">像素冒险</h1>
            <div class="menu-buttons">
                <button class="pixel-btn menu-btn" onclick="startGameFromMenu(1)">🎮 开始游戏</button>
                <button class="pixel-btn menu-btn" onclick="showLevelSelect()">📊 选择关卡</button>
                <button class="pixel-btn menu-btn" onclick="openInventoryFromMenu()">🎒 背包</button>
                <button class="pixel-btn menu-btn" onclick="openShop()">🏪 商店</button>
                <button class="pixel-btn menu-btn cancel" onclick="exitGame()">🚪 退出</button>
            </div>
        </div>
    </div>

    <div id="gameScreen" class="screen hidden">
        <div class="game-header">
            <div class="player-info">
                <span class="label">玩家:</span>
                <span id="playerName" class="value">勇者</span>
            </div>
            <div class="score-info">
                <span class="label">分数:</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="coins-info">
                <span class="label">金币:</span>
                <span id="coins" class="value">100</span>
            </div>
            <div class="level-info">
                <span class="label">关卡:</span>
                <span id="level" class="value">1</span>
            </div>
            <button class="pixel-btn small" onclick="pauseGame()">⏸️ 暂停</button>
        </div>
        
        <div class="game-container">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            
            <div class="mobile-controls">
                <div class="joystick-container" id="joystickContainer">
                    <div class="joystick-base"></div>
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>
                
                <div class="mobile-action-buttons">
                    <button class="mobile-btn attack-btn" onclick="playerAttack()">⚔️</button>
                    <button class="mobile-btn item-btn" onclick="openInventory()">🎒</button>
                </div>
            </div>
        </div>
        
        <div class="game-ui">
            <div class="health-bar">
                <div class="bar-label">HP</div>
                <div class="bar-container">
                    <div id="healthBar" class="bar-fill health"></div>
                </div>
                <span id="healthText">100/100</span>
            </div>
            
            <div class="action-buttons desktop-only">
                <button class="action-btn attack" onclick="playerAttack()">攻击</button>
                <button class="action-btn item" onclick="openInventory()">道具</button>
            </div>
        </div>
        
        <div id="inventory" class="modal hidden">
            <div class="modal-content">
                <h3>背包</h3>
                <div id="inventoryItems" class="inventory-grid"></div>
                <button class="pixel-btn small" onclick="closeInventory()">关闭</button>
            </div>
        </div>
        
        <div id="shop" class="modal hidden">
            <div class="modal-content">
                <h3>商店</h3>
                <div id="shopItems" class="shop-grid"></div>
                <button class="pixel-btn small" onclick="closeShop()">关闭</button>
            </div>
        </div>
        
        <div id="levelSelect" class="modal hidden">
            <div class="modal-content">
                <h3>选择关卡</h3>
                <div class="level-grid">
                    <button class="level-btn" onclick="startGameFromMenu(1)">🌲 森林</button>
                    <button class="level-btn" onclick="startGameFromMenu(2)">🌌 太空</button>
                    <button class="level-btn" onclick="startGameFromMenu(3)">🏰 地牢</button>
                </div>
                <button class="pixel-btn small" onclick="closeLevelSelect()">返回</button>
            </div>
        </div>
        
        <div id="luckyBlockModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="luckyBlockTitle">发现幸运方块！</h3>
                <p id="luckyBlockMessage"></p>
                <div class="modal-buttons">
                    <button class="pixel-btn" onclick="confirmLuckyBlock()">花费50金币开启</button>
                    <button class="pixel-btn cancel" onclick="cancelLuckyBlock()">取消</button>
                </div>
            </div>
        </div>
        
        <div id="pauseModal" class="modal hidden">
            <div class="modal-content">
                <h3>游戏暂停</h3>
                <div class="modal-buttons">
                    <button class="pixel-btn" onclick="resumeGame()">继续游戏</button>
                    <button class="pixel-btn" onclick="restartCurrentLevel()">重新开始</button>
                    <button class="pixel-btn cancel" onclick="backToMenu()">返回主菜单</button>
                </div>
            </div>
        </div>
        
        <div id="levelCompleteModal" class="modal hidden">
            <div class="modal-content">
                <h3>🎉 关卡完成！</h3>
                <p id="levelCompleteText"></p>
                <div class="modal-buttons">
                    <button class="pixel-btn" id="nextLevelBtn" onclick="nextLevel()">下一关</button>
                    <button class="pixel-btn" onclick="backToMenu()">返回主菜单</button>
                </div>
            </div>
        </div>
        
        <div id="resultModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="resultTitle"></h3>
                <p id="resultText"></p>
                <button class="pixel-btn" onclick="handleResultClose()">确定</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
